name: Hexo Build and Deploy

on:
  push:
    branches:
      - backup
  workflow_dispatch:

# Avoid concurrent deploys clobbering each other
concurrency:
  group: hexo-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: backup
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static files
        # `npm run build` may print "Process failed:" warnings for non-page
        # .md files (README, CHANGELOG) that ship with the repo. They're
        # benign — hexo still emits the real posts. Don't fail the workflow
        # on those; instead verify the actual homepage rendered.
        run: |
          npm run clean
          npm run build || true
          if [ ! -f public/index.html ]; then
            echo "::error::Build did not produce public/index.html — aborting deploy."
            exit 1
          fi

      - name: Ensure .nojekyll exists in public/
        run: touch public/.nojekyll

      # Push public/ to main using a PAT — GITHUB_TOKEN cannot trigger a
      # subsequent workflow run on the same repo (Pages' build), so we need a
      # personal access token stored as the HEXO_DEPLOY_TOKEN secret.
      - name: Deploy public/ to main branch
        env:
          DEPLOY_TOKEN: ${{ secrets.HEXO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::HEXO_DEPLOY_TOKEN secret is not set."
            echo "Create a PAT with 'repo' + 'workflow' scopes at"
            echo "https://github.com/settings/tokens and add it as a secret named"
            echo "HEXO_DEPLOY_TOKEN in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Use a temp clone to swap branches cleanly
          TMPDIR=$(mktemp -d)
          git clone --depth 1 --branch main "https://x-access-token:${DEPLOY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TMPDIR/main"
          # Configure identity inside the cloned repo (config is per-repo)
          git -C "$TMPDIR/main" config user.name "GitHub Actions"
          git -C "$TMPDIR/main" config user.email "actions@github.com"
          rm -rf "$TMPDIR/main"/*
          cp -r public/. "$TMPDIR/main/"
          cd "$TMPDIR/main"
          # Preserve .nojekyll (already in public/, copied above)
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: auto-build from backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
